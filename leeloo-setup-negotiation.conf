# Content negotiation for the Leeloo setup instructions
# ------------------------------------------------------
# One URL, two representations:
#
#   https://support.leeloo.ai/leeloo-claude-setup.html
#     · opened in a browser  -> the formatted HTML page
#     · fetched by an agent  -> leeloo-claude-setup.md as text/plain
#
# Both files live side by side in the site root:
#   leeloo-claude-setup.html
#   leeloo-claude-setup.md
#
# The signal is the Sec-Fetch-Mode request header. Browsers send
# `Sec-Fetch-Mode: navigate` on a top-level page load; agent HTTP clients
# (curl, fetch, python-requests, the tools an agent uses) do not send the
# header at all. Anything that is not a navigation gets the text version,
# which is also the safer default: a human who lands on the text version can
# still read it, whereas an agent handed 200 KB of markup often cannot.


# ---------------------------------------------------------------- http { }
# Put this in the http block — a map cannot live inside server or location.

map $http_sec_fetch_mode $leeloo_is_navigation {
    "navigate"  1;
    default     0;
}


# -------------------------------------------------------------- server { }
# Add these two locations to the server block for support.leeloo.ai.
# Adjust `root` to the directory the site is actually served from.

location = /leeloo-claude-setup.html {
    root /var/www/support;

    # Not a browser navigation -> serve the markdown instead.
    if ($leeloo_is_navigation = 0) {
        rewrite ^ /leeloo-claude-setup.md last;
    }

    # Caches and CDNs must key on the header, or one visitor's variant
    # gets served to the other kind of client.
    add_header Vary "Sec-Fetch-Mode" always;
}

location = /leeloo-claude-setup.md {
    root /var/www/support;

    # Empty types{} clears the extension->MIME map for this location, so
    # default_type always wins. Without it nginx may serve .md as
    # text/markdown or application/octet-stream, and some clients download
    # the file instead of reading it.
    types { }
    default_type text/plain;
    charset utf-8;

    add_header Vary "Sec-Fetch-Mode" always;
    add_header Cache-Control "no-cache" always;
}


# ------------------------------------------------------------------ verify
# After `nginx -t && systemctl reload nginx`:
#
#   # agent view — expect text/plain and the "plain text version" first line
#   curl -sI https://support.leeloo.ai/leeloo-claude-setup.html | grep -i content-type
#   curl -s  https://support.leeloo.ai/leeloo-claude-setup.html | head -3
#
#   # browser view — expect text/html
#   curl -sI https://support.leeloo.ai/leeloo-claude-setup.html \
#     -H "Sec-Fetch-Mode: navigate" | grep -i content-type
#
# And open the URL in a real browser: it must still render the page.


# -------------------------------------------------------------- trade-offs
# · A browser too old to send Sec-Fetch-Mode gets the text version. Every
#   current browser sends it; the degradation is readable, not broken.
# · Fetching the page from an address bar as a direct file download (Ctrl+S,
#   some download managers) is not a navigation either, so it saves the text
#   version. Acceptable for this page.
# · If a CDN sits in front of nginx, confirm it forwards Sec-Fetch-Mode and
#   honours Vary. If it strips the header, every request looks like an agent
#   and humans get the text version — in that case negotiate on the CDN
#   instead, or fall back to two separate URLs.
