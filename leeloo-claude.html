<meta charset="utf-8">
<title>Leeloo.AI у Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root{
  --paper:#F5F2EC;
  --surface:#FFFFFF;
  --surface-2:#EFEAE1;
  --ink:#17161A;
  --ink-2:#56525C;
  --ink-3:#8B8792;
  --line:#DFD8CC;
  --line-soft:#EAE4D9;
  --claude:#C25E3C;
  --claude-soft:#F7E6DC;
  --claude-line:#E8C4B0;
  --leeloo:#0062C7;
  --leeloo-soft:#DEEBFB;
  --leeloo-line:#B3D2F3;
  --mint:#0B7F63;
  --warn:#9A5A05;
  --warn-soft:#FAEBD2;
  --warn-line:#EBD3A6;
  --shadow:0 1px 2px rgba(23,22,26,.05), 0 8px 24px -12px rgba(23,22,26,.14);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131318;
    --surface:#1B1B22;
    --surface-2:#23232C;
    --ink:#ECE9E3;
    --ink-2:#A7A4AF;
    --ink-3:#77747F;
    --line:#2E2E38;
    --line-soft:#26262F;
    --claude:#E88C68;
    --claude-soft:#33201896;
    --claude-line:#4A2E22;
    --leeloo:#62A9FF;
    --leeloo-soft:#12243796;
    --leeloo-line:#1E3A57;
    --mint:#4FD1A8;
    --warn:#E3AA57;
    --warn-soft:#2E230F96;
    --warn-line:#463415;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#131318;
  --surface:#1B1B22;
  --surface-2:#23232C;
  --ink:#ECE9E3;
  --ink-2:#A7A4AF;
  --ink-3:#77747F;
  --line:#2E2E38;
  --line-soft:#26262F;
  --claude:#E88C68;
  --claude-soft:#33201896;
  --claude-line:#4A2E22;
  --leeloo:#62A9FF;
  --leeloo-soft:#12243796;
  --leeloo-line:#1E3A57;
  --mint:#4FD1A8;
  --warn:#E3AA57;
  --warn-soft:#2E230F96;
  --warn-line:#463415;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--leeloo)}
code,kbd,pre{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brandmark{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.01em;font-size:15px;min-width:0;overflow:hidden;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.c{background:var(--claude)}
.dot.l{background:var(--leeloo)}
.brandmark .plus{color:var(--ink-3);font-weight:500}
.spacer{flex:1}
.langs{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--line-soft);flex:none}
.langs button{
  font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;
  border:0;background:transparent;color:var(--ink-3);
  padding:5px 13px;border-radius:999px;cursor:pointer;transition:.15s;
}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:focus-visible{outline:2px solid var(--leeloo);outline-offset:2px;border-radius:6px}

/* ---------- hero ---------- */
.hero{padding:76px 0 52px;border-bottom:1px solid var(--line-soft)}
.eyebrow{
  font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 20px;
}
h1{
  font-family:"Unbounded","Manrope",sans-serif;
  font-weight:700;font-size:clamp(38px,6.2vw,68px);line-height:1.02;letter-spacing:-.035em;
  margin:0 0 22px;text-wrap:balance;max-width:16ch;
}
h1 .accent{
  background:linear-gradient(100deg,var(--leeloo) 0%,var(--leeloo) 42%,var(--claude) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lead{font-size:clamp(17px,2.1vw,20px);line-height:1.55;color:var(--ink-2);max-width:56ch;margin:0 0 30px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px;
}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:250px 1fr;gap:64px;align-items:start;padding:56px 0 40px}
.rail{position:sticky;top:86px}
.rail-title{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail a{
  display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:baseline;
  text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:600;
  padding:10px 12px;border-radius:10px;border-left:2px solid transparent;transition:.15s;
}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a .n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3);font-weight:500}
.rail a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rail a.on.c{border-left-color:var(--claude)}
.rail a.on.l{border-left-color:var(--leeloo)}
.rail a.on .n{color:inherit}

/* ---------- steps ---------- */
.steps{display:flex;flex-direction:column;gap:28px;min-width:0}
.step{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:86px;
}
.step .stripe{height:3px}
.step.c .stripe{background:var(--claude)}
.step.l .stripe{background:var(--leeloo)}
.step.b .stripe{background:linear-gradient(90deg,var(--claude),var(--leeloo))}
.step-hd{display:flex;align-items:flex-start;gap:20px;padding:28px 32px 4px}
.numeral{
  font-family:"Unbounded",monospace;font-weight:500;font-size:34px;line-height:1;
  letter-spacing:-.04em;color:var(--ink-3);opacity:.5;flex:none;padding-top:2px;
}
.step h2{
  font-family:"Manrope",sans-serif;font-weight:800;font-size:clamp(21px,2.5vw,26px);
  letter-spacing:-.02em;line-height:1.2;margin:0 0 9px;text-wrap:balance;
}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px;border:1px solid;
}
.badge.c{color:var(--claude);background:var(--claude-soft);border-color:var(--claude-line)}
.badge.l{color:var(--leeloo);background:var(--leeloo-soft);border-color:var(--leeloo-line)}
.step-body{padding:14px 32px 32px 76px}
.step-body>*:first-child{margin-top:0}
.step-body p{margin:0 0 18px;color:var(--ink-2);max-width:64ch}
.step-body p strong{color:var(--ink);font-weight:700}

h3.sub{
  font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:28px 0 14px;display:flex;align-items:center;gap:12px;
}
h3.sub::after{content:"";flex:1;height:1px;background:var(--line-soft)}

ol.steplist{margin:0 0 20px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steplist li{
  counter-increment:s;position:relative;padding-left:34px;color:var(--ink-2);max-width:64ch;
}
ol.steplist li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
}
ol.steplist li strong{color:var(--ink);font-weight:700}
ol.steplist code,p code,.note code{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:5px;
  padding:1px 6px;font-size:.86em;color:var(--ink);
}

/* code / copy block */
.cb{margin:0 0 20px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2)}
.cb-hd{
  display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;
  border-bottom:1px solid var(--line-soft);
}
.cb-label{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.cb pre{margin:0;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.copy{
  margin-left:auto;font:inherit;font-size:12px;font-weight:700;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:7px;padding:4px 11px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.copy:hover{color:var(--ink);border-color:var(--ink-3)}
.copy.done{color:var(--mint);border-color:var(--mint)}

/* notes */
.note{
  display:grid;grid-template-columns:auto 1fr;gap:13px;
  border:1px solid;border-radius:11px;padding:15px 17px;margin:0 0 20px;max-width:66ch;
}
.note .ic{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:13px;line-height:1.5}
.note .nt{font-weight:800;font-size:14px;margin:0 0 4px;letter-spacing:-.01em}
.note p{margin:0;font-size:14.5px;line-height:1.55}
.note.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.note.warn .ic,.note.warn .nt{color:var(--warn)}
.note.warn p{color:var(--ink-2)}
.note.info{background:var(--leeloo-soft);border-color:var(--leeloo-line)}
.note.info .ic,.note.info .nt{color:var(--leeloo)}
.note.info p{color:var(--ink-2)}

/* rules list in step 4 */
.rules{display:grid;gap:11px;margin:0 0 26px;padding:0;list-style:none}
.rules li{
  display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:baseline;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:13px 16px;
  color:var(--ink-2);font-size:15px;max-width:66ch;
}
.rules b{color:var(--ink);font-weight:800}
.rules .k{
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--surface);
}

/* skill download links */
.dl{
  display:inline-flex;align-items:center;gap:9px;
  font-size:14.5px;font-weight:700;color:var(--ink);text-decoration:none;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 15px;margin:0 9px 9px 0;transition:.15s;
}
.dl:hover{border-color:var(--leeloo);color:var(--leeloo)}
.dl .ext{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;color:var(--ink-3)}
.dl:hover .ext{color:var(--leeloo)}

/* prompt cards */
.prompts{display:grid;gap:12px;margin:0}
.pc{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.pc>summary{
  display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;list-style:none;
  font-weight:700;font-size:15px;letter-spacing:-.01em;
}
.pc>summary::-webkit-details-marker{display:none}
.pc>summary:hover{background:var(--surface-2)}
.pc .tag{
  font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;
  color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 7px;flex:none;
}
.pc .chev{margin-left:auto;color:var(--ink-3);transition:transform .18s;flex:none;font-size:13px}
.pc[open] .chev{transform:rotate(90deg)}
.pc .pbody{padding:0 16px 16px}
.pc .pbody .cb{margin:0}
.pc .why{font-size:13.5px;color:var(--ink-3);margin:10px 0 0;max-width:66ch}

/* footer */
.foot{border-top:1px solid var(--line-soft);padding:34px 0 64px;color:var(--ink-3);font-size:14px}
.foot .fwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--ink)}

@media (max-width:900px){
  .cols{grid-template-columns:1fr;gap:0;padding-top:36px}
  .rail{position:static;margin-bottom:34px;padding-bottom:26px;border-bottom:1px solid var(--line-soft)}
  .step-body{padding:14px 22px 26px 22px}
  .step-hd{padding:22px 22px 4px;gap:14px}
  .numeral{font-size:26px}
  .wrap{padding:0 18px}
  .hero{padding:52px 0 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <div class="wrap">

/* ---------------- render ---------------- */
const $ = s => document.querySelector(s);
let lang = "ua";
try{ const s = localStorage.getItem("lc-lang"); if(s && DATA[s]) lang = s; }catch(e){}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function codeBlock(label, value, L){
  return `<div class="cb"><div class="cb-hd"><span class="cb-label">${esc(label)}</span>
    <button class="copy" type="button" data-copy="${esc(value)}">${esc(L.copy)}</button></div>
    <pre>${esc(value)}</pre></div>`;
}

function renderBlocks(blocks, L){
  let out = "";
  for(const b of blocks){
    if(b.t==="p") out += `<p>${b.v}</p>`;
    else if(b.t==="sub") out += `<h3 class="sub">${esc(b.v)}</h3>`;
    else if(b.t==="ol") out += `<ol class="steplist">${b.v.map(x=>`<li>${x}</li>`).join("")}</ol>`;
    else if(b.t==="code") out += codeBlock(b.label, b.v, L);
    else if(b.t==="note") out += `<div class="note ${b.k}"><span class="ic">${b.k==="warn"?"!":"i"}</span>
        <div><p class="nt">${b.nt}</p><p>${b.v}</p></div></div>`;
    else if(b.t==="rules") out += `<ul class="rules">${b.v.map(([k,t])=>`<li><span class="k">${esc(k)}</span><span>${t}</span></li>`).join("")}</ul>`;
    else if(b.t==="prompts") out += `<div class="prompts">${L.prompts.map(p=>`
        <details class="pc">
          <summary><span class="tag">${esc(p.tag)}</span><span>${esc(p.h)}</span><span class="chev">›</span></summary>
          <div class="pbody">${codeBlock("prompt", p.v, L)}<p class="why">${esc(p.why)}</p></div>
        </details>`).join("")}</div>`;
  }
  return out;
}

function render(){
  const L = DATA[lang];
  document.documentElement.lang = lang;

  $("#langs").innerHTML = Object.keys(DATA).map(k =>
    `<button type="button" data-lang="${k}" aria-pressed="${k===lang}">${DATA[k].name}</button>`).join("");

  $("#hEyebrow").textContent = L.eyebrow;
  $("#hTitle").innerHTML = `${esc(L.title[0])}<span class="accent">${esc(L.title[1])}</span>`;
  $("#hLead").textContent = L.lead;
  $("#hChips").innerHTML = L.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("");

  $("#railTitle").textContent = L.railTitle;
  $("#rail").innerHTML = L.rail.map((r,i)=>
    `<li><a href="#step-${i+1}" class="${L.steps[i].app}" data-i="${i+1}"><span class="n">0${i+1}</span><span>${esc(r)}</span></a></li>`).join("");

  $("#steps").innerHTML = L.steps.map((s,i)=>`
    <section class="step ${s.app}" id="step-${i+1}">
      <div class="stripe"></div>
      <div class="step-hd">
        <span class="numeral">0${i+1}</span>
        <div>
          <h2>${esc(s.h)}</h2>
          <span class="badge ${s.app==="b"?"c":s.app}">${esc(s.badge)}</span>
        </div>
      </div>
      <div class="step-body">${renderBlocks(s.b, L)}</div>
    </section>`).join("");

  $("#footNote").textContent = L.foot;
  spy();
}

/* copy */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-copy]");
  if(b){
    const txt = b.getAttribute("data-copy");
    const done = ()=>{ const o=b.textContent; b.textContent=DATA[lang].copied; b.classList.add("done");
      setTimeout(()=>{b.textContent=o;b.classList.remove("done");},1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); }
    else fallback(txt,done);
    return;
  }
  const l = e.target.closest("[data-lang]");
  if(l){ lang = l.getAttribute("data-lang"); try{localStorage.setItem("lc-lang",lang);}catch(err){} render(); }
});
function fallback(txt,cb){
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){}
  document.body.removeChild(ta);
}

/* scroll spy */
let obs;
function spy(){
  if(obs) obs.disconnect();
  const links = [...document.querySelectorAll("#rail a")];
  obs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const id = en.target.id.split("-")[1];
        links.forEach(a=>a.classList.toggle("on", a.dataset.i===id));
      }
    });
  }, {rootMargin:"-84px 0px -60% 0px", threshold:0});
  document.querySelectorAll(".step").forEach(s=>obs.observe(s));
}

render();
</script>
